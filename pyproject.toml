[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.1.0"
description = "Evidence-grounded invoice extraction with resumable processing and evaluation"
requires-python = ">=3.11"
authors = [{name = "Abhinit Sen"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
evidence-ledger = "docintel.cli:main"

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.setuptools.package-data]
docintel = ["web/*.html", "web/*.js"]
