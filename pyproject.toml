[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.9.1"
description = "Evidence-grounded invoice extraction with resumable processing and evaluation"
requires-python = ">=3.11"
authors = [{name = "Abhinit Sen"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
vision = ["Pillow==12.3.0"]
cloud = ["google-auth==2.61.0", "google-auth-oauthlib==1.5.0", "requests==2.34.2"]
ocr = ["Pillow==12.3.0", "paddleocr==3.7.0", "paddlepaddle==3.3.1", "paddlex==3.7.2"]

[project.scripts]
evidence-ledger = "docintel.cli:main"

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.setuptools.package-data]
docintel = ["web/*.html", "web/*.js", "*.mjs"]
